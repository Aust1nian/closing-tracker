[package]
name = "closing-relay"
version = "0.1.0"
edition = "2024"
description = "Closing Tracker relay: carries sealed messages between a shop's phones and sends closing alerts"
publish = false

[[bin]]
name = "closing-relay"
path = "src/main.rs"

[[bin]]
name = "relayctl"
path = "src/bin/relayctl.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util", "sync"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
